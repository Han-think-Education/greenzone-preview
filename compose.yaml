# 기본 웹은 AI 없이도 동작하며 AI는 .env에서 선택적으로 연결합니다.
name: greenzone-preview
services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      GREENZONE_AI_ENABLED: ${GREENZONE_AI_ENABLED:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
      DEMO_DB_PATH: /app/storage/demo.db
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - greenzone_sqlite:/app/storage
volumes:
  greenzone_sqlite:
